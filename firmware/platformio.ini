; ESP32-S3-DevKitC-1 v1.3 — ESP32-S3-WROOM-1-N16R8
; Verified identity: 16 MB quad flash, 8 MB octal PSRAM, MAC 84:c7:bb:58:23:ec.
;
; `boards/esp32s3_n16r8.json` is a local board manifest derived from the stock
; `esp32-s3-devkitc-1` (which is the N8 / no-PSRAM variant). The local manifest
; sets 16 MB flash, qio_opi (octal PSRAM) memory type and the 16 MB partition
; table, so the build log names the real module instead of the N8 default.
;
; Recovery: docs/RECOVERY.md. A verified full-flash backup exists in
; backups/20261110_203223 (git-ignored). Do not flash without it.
[env:esp32s3_n16r8]
platform = espressif32
board = esp32s3_n16r8
framework = arduino

; --- serial --------------------------------------------------------------
upload_port = COM6
upload_speed = 460800                 ; reliable on the CH343 bridge
monitor_port = COM6
monitor_speed = 2000000               ; matches Serial.begin(2000000)

build_src_filter =
    +<*>
    +<../components/link/*.c>
    +<../components/dsp/*.c>
    +<../components/snn/*.c>

build_flags =
    -O3
    -funroll-loops
    -Icomponents/link/include
    -Icomponents/dsp/include
    -Icomponents/snn/include
    -DCORE_DEBUG_LEVEL=0
