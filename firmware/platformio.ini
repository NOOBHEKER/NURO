[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 16MB
upload_port = COM6
monitor_port = COM6
monitor_speed = 921600
build_src_filter =
    +<*>
    +<../components/link/*.c>
    +<../components/dsp/*.c>
    +<../components/snn/*.c>
build_flags =
    -O2
    -Icomponents/link/include
    -Icomponents/dsp/include
    -Icomponents/snn/include
    -DCORE_DEBUG_LEVEL=0
