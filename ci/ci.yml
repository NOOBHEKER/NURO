name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  host-tests:
    name: Host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run hermetic test suite
        run: python -m pytest tests -q

  firmware-build:
    name: Firmware build (ESP32-S3 N16R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build firmware (no upload)
        run: |
          set -o pipefail
          python -m platformio run -d firmware | tee /tmp/build.log
      - name: Verify the build names the real module
        run: |
          grep -q "16MB Flash" /tmp/build.log
          grep -q "N16R8" /tmp/build.log
          python - <<'PY'
          import json
          board = json.load(open("firmware/boards/esp32s3_n16r8.json", encoding="utf-8"))
          assert board["build"]["arduino"]["memory_type"] == "qio_opi"
          assert board["upload"]["flash_size"] == "16MB"
          assert "N16R8" in board["name"]
          print("board manifest: N16R8 / qio_opi / 16MB OK")
          PY
